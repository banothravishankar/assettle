<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Asset Telematics | We Deliver Da Performance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --g: #1fd9a4;
            --b: #3b9ae1;
            --ink: #0b1b2b;
            --bg: #fff;
            --bg2: #f2f7fb;
            --card: #fff;
            --mut: #58697a;
            --line: #e1e9f0;
            --gr: linear-gradient(135deg, var(--g), var(--b));
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --ink: #eaf3fa;
                --bg: #08121c;
                --bg2: #0c1a28;
                --card: #10202f;
                --mut: #9bb0c2;
                --line: #1d3246
            }
        }

        :root[data-theme=dark] {
            --ink: #eaf3fa;
            --bg: #08121c;
            --bg2: #0c1a28;
            --card: #10202f;
            --mut: #9bb0c2;
            --line: #1d3246
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.65;
            overflow-x: hidden
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .w {
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 22px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 50;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line)
        }

        .nv {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px
        }

        .logo img {
            height: 44px;
            display: block;
            background: #fff;
            border-radius: 10px;
            padding: 2px 6px
        }

        nav {
            display: flex;
            gap: 4px;
            align-items: center
        }

        nav>div {
            position: relative
        }

        nav>div>a,
        nav>a {
            display: block;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 14.5px;
            border-radius: 10px;
            color: var(--ink);
            transition: .2s
        }

        nav>div>a:hover,
        nav>a:hover,
        nav a.on {
            background: var(--bg2);
            color: var(--b)
        }

        .dd {
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 220px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 8px;
            box-shadow: 0 18px 40px #0003;
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: .25s
        }

        nav>div:hover .dd,
        nav>div:focus-within .dd {
            opacity: 1;
            visibility: visible;
            transform: none
        }

        .dd a {
            display: block;
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 500
        }

        .dd a:hover {
            background: var(--bg2);
            color: var(--b)
        }

        .cta-n {
            background: var(--gr);
            color: #04202a !important;
            font-weight: 700 !important
        }

        .bg {
            display: none;
            background: none;
            border: 1px solid var(--line);
            border-radius: 10px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            color: var(--ink);
            font-size: 20px
        }

        .btn {
            display: inline-block;
            padding: 13px 26px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 15px;
            border: 2px solid transparent;
            transition: .25s;
            cursor: pointer;
            font-family: inherit
        }

        .p {
            background: var(--gr);
            color: #04202a;
            box-shadow: 0 10px 26px #1fd9a455
        }

        .p:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 34px #3b9ae155
        }

        .o {
            border-color: var(--b);
            color: var(--b)
        }

        .o:hover {
            background: var(--b);
            color: #fff;
            transform: translateY(-3px)
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 84px 0 72px;
            background: radial-gradient(1000px 500px at 85% -10%, #3b9ae122, transparent), var(--bg)
        }

        .hero .w {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1.15fr .85fr;
            gap: 40px;
            align-items: center
        }

        .hero.s .w {
            grid-template-columns: 1fr
        }

        .hero.s {
            padding: 70px 0 56px
        }

        .bl {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .35;
            animation: fl 12s ease-in-out infinite
        }

        .b1 {
            width: 380px;
            height: 380px;
            background: var(--g);
            top: -120px;
            right: 8%
        }

        .b2 {
            width: 320px;
            height: 320px;
            background: var(--b);
            bottom: -140px;
            left: -60px;
            animation-delay: -5s
        }

        @keyframes fl {
            50% {
                transform: translate(30px, 40px) scale(1.12)
            }
        }

        .eb {
            display: inline-block;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--b);
            background: var(--bg2);
            border: 1px solid var(--line);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 18px
        }

        h1 {
            font-size: clamp(32px, 5vw, 56px);
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -.02em;
            margin-bottom: 18px
        }

        h1 em,
        h2 em {
            font-style: normal;
            background: var(--gr);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .hero p.lead {
            font-size: 18px;
            color: var(--mut);
            max-width: 620px;
            margin-bottom: 28px
        }

        .bt {
            display: flex;
            gap: 14px;
            flex-wrap: wrap
        }

        .vis {
            position: relative;
            height: 340px
        }

        .gc {
            position: absolute;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 20px;
            box-shadow: 0 20px 50px #0002;
            animation: fl 8s ease-in-out infinite
        }

        .gc b {
            display: block;
            font-size: 26px;
            background: var(--gr);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .gc span {
            font-size: 13px;
            color: var(--mut)
        }

        .gc:nth-child(1) {
            top: 10px;
            left: 10%
        }

        .gc:nth-child(2) {
            top: 120px;
            right: 0;
            animation-delay: -3s
        }

        .gc:nth-child(3) {
            bottom: 0;
            left: 22%;
            animation-delay: -6s
        }

        .pl {
            position: absolute;
            inset: 40px 40px;
            border-radius: 50%;
            border: 2px dashed var(--line);
            animation: sp 40s linear infinite
        }

        .pl i {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--g);
            box-shadow: 0 0 0 0 #1fd9a488;
            animation: pu 2s infinite
        }

        .pl i:nth-child(1) {
            top: -7px;
            left: 50%
        }

        .pl i:nth-child(2) {
            bottom: 20%;
            right: -7px;
            background: var(--b)
        }

        .pl i:nth-child(3) {
            bottom: -7px;
            left: 25%
        }

        @keyframes sp {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes pu {
            70% {
                box-shadow: 0 0 0 16px #1fd9a400
            }
        }

        .sec {
            padding: 76px 0
        }

        .sec.alt {
            background: var(--bg2)
        }

        h2 {
            font-size: clamp(26px, 3.6vw, 40px);
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -.015em;
            margin-bottom: 14px
        }

        .sub {
            color: var(--mut);
            max-width: 680px;
            margin-bottom: 36px;
            font-size: 17px
        }

        .lead {
            color: var(--mut);
            font-size: 17px;
            max-width: 860px;
            margin-bottom: 14px
        }

        .gd {
            display: grid;
            gap: 22px;
            grid-template-columns: repeat(auto-fit, minmax(255px, 1fr))
        }

        .cd {
            position: relative;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 26px;
            transition: .3s;
            overflow: hidden;
            display: block
        }

        .cd:before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 4px;
            width: 0;
            background: var(--gr);
            transition: .4s
        }

        .cd:hover {
            transform: translateY(-8px);
            box-shadow: 0 22px 44px #0b1b2b22;
            border-color: transparent
        }

        .cd:hover:before {
            width: 100%
        }

        .nm {
            display: inline-grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--gr);
            color: #04202a;
            font-weight: 800;
            margin-bottom: 14px
        }

        .cd h3 {
            font-size: 18px;
            margin-bottom: 8px
        }

        .cd p {
            color: var(--mut);
            font-size: 15px
        }

        .cd .mr {
            display: inline-block;
            margin-top: 12px;
            font-weight: 700;
            color: var(--b);
            font-size: 14px
        }

        .ck {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            margin-top: 18px
        }

        .ck li {
            padding: 14px 16px 14px 46px;
            position: relative;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            color: var(--mut);
            font-size: 15px
        }

        .ck li:before {
            content: "✓";
            position: absolute;
            left: 14px;
            top: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--gr);
            color: #04202a;
            font-weight: 800;
            display: grid;
            place-items: center;
            font-size: 13px
        }

        .st {
            background: linear-gradient(135deg, #0b2a3f, #0d4a63);
            color: #fff;
            padding: 60px 0
        }

        .sg {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 24px;
            text-align: center
        }

        .sg b {
            display: block;
            font-size: clamp(36px, 5vw, 54px);
            font-weight: 800;
            background: linear-gradient(135deg, #46f0c0, #7cc3f5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .sg span {
            opacity: .85;
            font-size: 15px
        }

        .chs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px
        }

        .chs span {
            padding: 11px 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            font-weight: 600;
            font-size: 14.5px;
            transition: .25s
        }

        .chs span:hover {
            background: var(--gr);
            color: #04202a;
            transform: translateY(-3px);
            border-color: transparent
        }

        .tl {
            position: relative;
            padding-left: 30px;
            border-left: 3px solid var(--line);
            display: grid;
            gap: 26px;
            margin-top: 10px
        }

        .tl div {
            position: relative
        }

        .tl div:before {
            content: "";
            position: absolute;
            left: -40px;
            top: 6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--gr);
            box-shadow: 0 0 0 6px var(--bg2)
        }

        .tl b {
            font-size: 20px;
            color: var(--b)
        }

        .tl p {
            color: var(--mut)
        }

        details {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            margin-bottom: 14px;
            overflow: hidden;
            transition: .25s
        }

        details[open] {
            box-shadow: 0 14px 34px #0b1b2b1c
        }

        summary {
            cursor: pointer;
            padding: 20px 24px;
            font-weight: 700;
            font-size: 17px;
            list-style: none;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center
        }

        summary::-webkit-details-marker {
            display: none
        }

        summary:after {
            content: "+";
            font-size: 26px;
            color: var(--b);
            transition: .3s
        }

        details[open] summary:after {
            transform: rotate(45deg)
        }

        summary small {
            display: block;
            color: var(--mut);
            font-weight: 500;
            font-size: 13.5px
        }

        .jb {
            padding: 0 24px 22px;
            color: var(--mut);
            font-size: 15px
        }

        .jb h4 {
            color: var(--ink);
            margin: 12px 0 6px
        }

        .jb ul {
            padding-left: 20px;
            display: grid;
            gap: 5px
        }

        .qt {
            font-size: 15.5px;
            color: var(--mut);
            margin-bottom: 16px
        }

        .qt:before {
            content: "“";
            font-size: 52px;
            line-height: 0;
            display: block;
            height: 22px;
            background: var(--gr);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .au b {
            display: block
        }

        .au span {
            font-size: 13.5px;
            color: var(--mut)
        }

        .fm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }

        .fm label {
            font-size: 13.5px;
            font-weight: 600;
            display: block
        }

        .fm .f {
            grid-column: 1/-1
        }

        .fm input,
        .fm textarea {
            width: 100%;
            margin-top: 6px;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            font: inherit;
            transition: .2s
        }

        .fm input:focus,
        .fm textarea:focus {
            outline: none;
            border-color: var(--b);
            box-shadow: 0 0 0 4px #3b9ae133
        }

        .ct {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 34px;
            align-items: start
        }

        .mp {
            width: 100%;
            height: 300px;
            border: 0;
            border-radius: 20px;
            margin-top: 18px
        }

        .cta {
            background: var(--gr);
            padding: 60px 0;
            text-align: center;
            color: #04202a
        }

        .cta h2 {
            margin-bottom: 10px
        }

        .cta .btn {
            background: #04202a;
            color: #fff;
            margin-top: 14px
        }

        .cta .btn:hover {
            transform: translateY(-3px)
        }

        footer {
            background: #07141f;
            color: #b5c7d6;
            padding: 60px 0 24px;
            font-size: 14.5px
        }

        .fg {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1.3fr;
            gap: 34px
        }

        .fg h5 {
            color: #fff;
            font-size: 14px;
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 14px
        }

        .fg a {
            display: block;
            padding: 3px 0
        }

        .fg a:hover {
            color: var(--g)
        }

        .fg img {
            height: 46px;
            background: #fff;
            border-radius: 10px;
            padding: 3px 7px;
            margin-bottom: 14px
        }

        .cp {
            border-top: 1px solid #1b3144;
            margin-top: 36px;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13.5px
        }

        .wa {
            position: fixed;
            right: 18px;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #25d366;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 26px #0005;
            font-size: 26px;
            animation: pu2 2.4s infinite
        }

        @keyframes pu2 {
            70% {
                box-shadow: 0 0 0 18px #25d36600
            }
        }

        .rv {
            opacity: 0;
            transform: translateY(34px);
            transition: opacity .8s, transform .8s cubic-bezier(.2, .7, .2, 1)
        }

        .rv.in {
            opacity: 1;
            transform: none
        }

        main {
            animation: pg .6s ease
        }

        @keyframes pg {
            from {
                opacity: 0;
                transform: translateY(14px)
            }
        }

        @media(max-width:900px) {
            .bg {
                display: block
            }

            nav {
                position: fixed;
                top: calc(70px + env(safe-area-inset-top, 0px));
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--bg);
                flex-direction: column;
                align-items: stretch;
                padding: 16px 22px;
                overflow: auto;
                transform: translateX(100%);
                transition: .35s
            }

            nav.open {
                transform: none
            }

            .dd {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                box-shadow: none;
                border: 0;
                padding: 0 0 6px 14px;
                background: none
            }

            .hero .w,
            .ct,
            .fg {
                grid-template-columns: 1fr
            }

            .vis {
                height: 260px
            }

            .fm {
                grid-template-columns: 1fr
            }

            .sec {
                padding: 56px 0
            }

            .ck {
                grid-template-columns: 1fr
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }

            .rv {
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

<body>

        function render() {
            let id = location.hash.slice(1) || 'home'; if (!P[id]) id = 'home'; const p = P[id], h = p.hero; nav(id);
            let o = `<section class="hero ${h.vis ? '' : 's'}"><div class="bl b1"></div><div class="bl b2"></div><div class="w"><div><span class="eb">${h.e}</span><h1>${h.h}</h1><p class="lead">${h.p}</p>${h.b ? `<div class="bt">${h.b.map(b => `<a class="btn ${b[2]}" href="${b[1]}" ${b[1][0] != '#' ? 'target="_blank" rel="noopener"' : ''}>${b[0]}</a>`).join('')}</div>` : ''}</div>${h.vis ? `<div class="vis"><div class="pl"><i></i><i></i><i></i></div><div class="gc"><b>20K+</b><span>Connected assets</span></div><div class="gc"><b>15+ yrs</b><span>Digital transformation</span></div><div class="gc"><b>95%</b><span>Repeat clients</span></div></div>` : ''}</div></section>`;
            o += p.S.map(s => `<section class="${s.k == 's' ? 'st' : 'sec'} ${s.alt ? 'alt' : ''} ${s.k == 's' ? '' : 'rv'}" ${s.id ? `id="${s.id}"` : ''}>${R[s.k](s)}</section>`).join('');
            if (id != 'contact-us') o += `<section class="cta"><div class="w rv"><h2>Ready to build something remarkable?</h2><p>Talk to our Business Experts about a customized solution for your business.</p><a class="btn" href="#contact-us">Start the conversation</a></div></section>`;
            $('#m').innerHTML = o; scrollTo(0, 0);
            const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; e.target.classList.add('in'); e.target.querySelectorAll('[data-n]').forEach(c => { const t = +c.dataset.n, s = performance.now(); (function f(n) { const k = Math.min(1, (n - s) / 1400); c.textContent = Math.round(t * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f) })(s) }); io.unobserve(e.target) }), { threshold: .12 });
            document.querySelectorAll('.rv,.st').forEach(e => io.observe(e));
            const fm = $('#fm'); if (fm) fm.onsubmit = e => { e.preventDefault(); const d = new FormData(fm); location.href = `mailto:info@assettl.com?subject=${encodeURIComponent('Website enquiry from ' + d.get('a') + ' ' + d.get('b'))}&body=${encodeURIComponent(d.get('d') + '\n\nEmail: ' + d.get('e') + '\nMobile: ' + d.get('m'))}`; $('#ok').textContent = 'Opening your email app…' }
        }
        $('#bg').onclick = () => $('#nv').classList.toggle('open');
        addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id == 'features') { document.getElementById('features')?.scrollIntoView(); return } render() });
        foot(); render();
